<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birdquest sign-in</title><style>body{font:18px system-ui;max-width:450px;margin:70px auto;padding:24px;background:#f7f8f3;color:#263e32}button{padding:16px;background:#263e32;color:white;border:0;border-radius:10px;font-size:18px}p{line-height:1.6}</style><h1>Sign in to Birdquest</h1><p>Use samsun24@gmail.com for this test build.</p><button id="login">Continue with Google</button><p id="status" role="status"></p><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,setPersistence,inMemoryPersistence,signOut} from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
const config={"apiKey": "AIzaSyAIeyJzEtArsgcZYdCh7-ZqtbVstG9UmRU", "authDomain": "birdquest-513904.firebaseapp.com", "projectId": "birdquest-513904", "appId": "1:370921589987:android:831c9d8c77943c1c6989d6"};const auth=getAuth(initializeApp(config));const key=new URLSearchParams(location.hash.slice(1)).get('session');history.replaceState(null,'',location.pathname);
const status=document.querySelector('#status'),button=document.querySelector('#login');
if(!key){button.disabled=true;status.textContent='Start sign-in from the Birdquest app.'}
button.onclick=async()=>{button.disabled=true;try{await setPersistence(auth,inMemoryPersistence);const result=await signInWithPopup(auth,new GoogleAuthProvider());const token=await result.user.getIdToken();const response=await fetch('/session/complete',{method:'POST',headers:{Authorization:'Bearer '+token,'X-Pairing-Key':key}});if(!response.ok){const e=await response.json();throw new Error(e.detail||'Could not finish sign-in.')}await signOut(auth);status.textContent='Signed in. Return to Birdquest to finish connecting.';}catch(e){status.textContent=e.message;button.disabled=false}};
</script>
